# Configuration de développement — épreuve finale KFOKAM48.
#
# La base est fournie par compose.yaml à la racine du dépôt :
#   docker compose up -d
#
# Configuration locale : un seul fichier, `.env` à la racine du dépôt, décrit par `.env.example`.
# Il est lu ci-dessous et jamais commité (voir .gitignore). Les variables de l'environnement
# gardent la main sur lui — l'ordre habituel : la ligne de commande, puis le .env, puis les
# valeurs par défaut de ce fichier.
#   DB_PASSWORD=secret ./mvnw spring-boot:run

spring:
  application:
    name: epreuve

  config:
    # `optional:` — le fichier n'existe pas dans un clone neuf, et son absence ne doit pas empêcher
    # de démarrer : les valeurs par défaut ci-dessous suffisent.
    #
    # Chemin volontairement unique et relatif au répertoire de lancement : depuis backend/ (la
    # commande du README), `../.env` est la racine du dépôt. L'alternative — lire aussi `./.env` —
    # ferait remonter d'un cran de trop quand l'API est lancée depuis la racine, et lirait le `.env`
    # d'un autre projet voisin du répertoire personnel. Un fichier de configuration qui traverse
    # les frontières d'un projet est pire qu'un fichier absent.
    import: optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/epreuve}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    # B5 : le schéma appartient à Flyway, jamais à Hibernate.
    # Hibernate ne fait que vérifier que les entités collent au schéma migré.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  # SERVER_PORT vient du .env, ou de l'environnement : utile quand un autre service occupe déjà
  # 8080 sur le poste, sans avoir à modifier ce fichier.
  port: ${SERVER_PORT:8080}

  error:
    # ENF3 : aucune fuite technique dans une réponse HTTP.
    # Les exceptions métier passent par le @RestControllerAdvice, au format { code, message }.
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
