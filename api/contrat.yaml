openapi: 3.0.3
info:
  title: Contrat imposé — Épreuve finale KFOKAM48
  version: "1.0"
  description: |
    Les cinq opérations décrites ici doivent exister EXACTEMENT ainsi :
    mêmes chemins, mêmes verbes, mêmes codes de statut, même format d'erreur.
    Tout le reste de ton API est libre — ajoute tes propres opérations
    dans ce même fichier, sous /api, avant ton premier commit de code.

servers:
  - url: http://localhost:8080

paths:

  /api/sessions:
    post:
      summary: Le formateur ouvre une session et obtient un code de présence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, promotionId]
              properties:
                titre: { type: string }
                promotionId: { type: integer, format: int64 }
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt]
                properties:
                  id: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Erreur" }

  /api/sessions/{id}/cloture:
    post:
      summary: >
        Le formateur clôture une session (RG13). Ajoutée hors contrat imposé
        car aucune opération de clôture n'était prévue, alors que Q3, Q10,
        Q11, Q12 et Q15 en dépendent toutes — cf. cahier des charges section 7.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Session clôturée
          content:
            application/json:
              schema:
                type: object
                required: [id, clotureAt]
                properties:
                  id: { type: integer, format: int64 }
                  clotureAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_DEJA_CLOTUREE

  /api/presences:
    post:
      summary: Un étudiant marque sa présence avec le code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, etudiantId]
              properties:
                code: { type: string }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CODE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT
        "410": { $ref: "#/components/responses/Erreur" }   # CODE_EXPIRE
        # --- Ajout hors contrat imposé, cf. cahier des charges section 7 ---
        # RG8 (Q4) : après 5 échecs de code pour le même etudiantId, blocage de 2 minutes.
        # L'Annexe B ne prévoyait aucun statut pour une tentative bloquée ; sans ce code,
        # RG8 n'est pas observable par un client. Statut ajouté à une opération imposée :
        # extension assumée et documentée, les trois statuts imposés ci-dessus restant
        # inchangés. Le blocage vaut quel que soit le code saisi, y compris un code inconnu.
        "429": { $ref: "#/components/responses/Erreur" }   # TROP_DE_TENTATIVES

  /api/presences/formateur:
    post:
      summary: >
        Le formateur ajoute une présence à la main (RG11, Q14 : « ça arrive qu'un étudiant ait un
        souci de téléphone »). Ajoutée hors contrat imposé APRÈS le gel du contrat : RG11 était la
        seule règle de gestion sans opération pour l'exprimer, et sans elle la colonne source —
        dont l'Annexe B rappelle elle-même l'existence — n'avait aucune raison d'être renseignée.
        Aucun code de présence n'est demandé : le formateur intervient précisément quand l'étudiant
        n'a pas pu saisir le sien. Documenté en §7 du cahier des charges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence ajoutée, marquée source = FORMATEUR
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE | ETUDIANT_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT | SESSION_DEJA_CLOTUREE

  /api/exercices:
    post:
      summary: Un étudiant dépose le lien de son exercice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId, lien]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
                lien: { type: string, format: uri }
      responses:
        "201":
          description: Exercice déposé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_DEPOSE

  /api/exercices/{id}:
    put:
      summary: >
        L'étudiant remplace le lien de son exercice (EF4, RG10). Accepté tant que le
        relecteur assigné n'a pas rendu sa relecture, refusé ensuite — 409.
        Opération ajoutée hors contrat imposé.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lien]
              properties:
                lien: { type: string, format: uri }
      responses:
        "200":
          description: Lien remplacé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_RENDUE

  /api/relectures/{id}:
    post:
      summary: Un relecteur rend sa note et son commentaire
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture enregistrée }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_RENDUE

  /api/relectures/assignees:
    get:
      summary: >
        Relectures encore assignées à un étudiant (UC7). Ajoutée hors contrat imposé :
        c'est par cette opération que le relecteur découvre l'identifiant à passer au
        POST /api/relectures/{id} — sans elle, la relecture serait inatteignable.
        N'expose ni le lien du déposant ni l'identité de qui que ce soit.
      parameters:
        - name: relecteurId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: taille
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Relectures à rendre
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, exerciceId, sessionId, lien, statut]
                  properties:
                    id: { type: integer, format: int64 }
                    exerciceId: { type: integer, format: int64 }
                    sessionId: { type: integer, format: int64 }
                    lien: { type: string, format: uri }
                    statut: { type: string }

  /api/relectures/recues:
    get:
      summary: >
        Note retenue d'un exercice, vue par son auteur (EF7, RG6). Ajoutée hors contrat
        imposé : le contrat n'offrait aucun moyen de lire une note, seulement d'en écrire
        une. Expose la note retenue et le commentaire, jamais l'identité des relecteurs.
        Depuis le changement de besoin de l'étape 3, un exercice est relu par deux pairs : la
        note retenue est la moyenne des deux, ou la seule note rendue si une seule l'est —
        auquel cas `provisoire` vaut true.
      parameters:
        - name: etudiantId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: sessionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: >
            Note retenue de l'exercice déposé par cet étudiant pour cette session.
            Tant qu'aucune relecture n'est rendue, statut vaut ASSIGNEE et note et
            commentaire sont nuls. Quand les deux relectures sont rendues, les deux
            commentaires sont concaténés, dans l'ordre des rendus, sans aucun nom.
          content:
            application/json:
              schema:
                type: object
                required: [statut, provisoire]
                properties:
                  statut: { type: string }
                  # Nombre et non entier : la note retenue est une moyenne. La réponse de
                  # l'opération imposée POST /api/relectures/{id} reste entière, elle.
                  note: { type: number, nullable: true }
                  commentaire: { type: string, nullable: true }
                  provisoire:
                    type: boolean
                    description: >
                      Vrai tant que les deux relectures attendues n'ont pas rendu : la note
                      affichée est celle du seul pair qui a rendu, et elle peut encore changer.
                      Un booléen explicite plutôt qu'un statut à interpréter — le client lit
                      ce qu'il doit lire au lieu de deviner si RENDUE veut dire « définitif ».
                      Avec un seul pair disponible, la note reste provisoire indéfiniment :
                      le cas est assumé et documenté au cahier des charges, §7.
        "404": { $ref: "#/components/responses/Erreur" }   # RELECTURE_INCONNUE

  /api/tableau:
    get:
      summary: Le tableau récapitulatif du formateur
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        # --- Pagination, hors contrat imposé (cf. cahier des charges section 7) ---
        # Optionnels. Sans eux, la promotion entière est rendue : c'est le comportement
        # que décrit ce contrat, et il ne change pas. Avec eux, la réponse reste un
        # tableau JSON — jamais une enveloppe — et le total avant découpage est publié
        # dans l'en-tête X-Total-Count.
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: taille
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Récapitulatif par étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    presences: { type: integer }
                    exercicesDeposes: { type: integer }
                    moyenne: { type: number, nullable: true }
                    relecturesEnAttente: { type: integer }
        # 400 REQUETE_INVALIDE : page ou taille hors bornes. Ce statut n'est pas nouveau sur
        # cette opération — un promotionId non numérique y sortait déjà en 400 sous le même
        # code, par la règle générale des erreurs de forme (cahier des charges section 7).
        "400": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/promotions:
    get:
      summary: >
        Promotions disponibles. Ajoutée hors contrat imposé : POST /api/sessions exige un
        promotionId et l'écran formateur n'a aucun moyen de le choisir sans cette liste
        (EF2, F2).
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: taille
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }

  /api/etudiants:
    get:
      summary: >
        Étudiants d'une promotion. Ajoutée hors contrat imposé pour répondre à Q1 :
        l'étudiant s'identifie en se choisissant dans une liste, puis etudiantId est
        transmis dans les requêtes qui le demandent. Aucune authentification : hors
        périmètre de cette version (ENF5), choix assumé et non un oubli.
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: taille
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Étudiants de la promotion
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

components:
  schemas:
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Identifiant stable, en majuscules. Exemple - CODE_EXPIRE
        message:
          type: string
          description: Phrase lisible par un humain, en français
  responses:
    Erreur:
      description: |
        Format d'erreur imposé pour TOUTES les erreurs, sans exception.
        Une stack trace, un corps vide ou la page d'erreur par défaut de Spring
        valent zéro sur ce critère.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
          example:
            code: CODE_EXPIRE
            message: Le code de présence a expiré.
